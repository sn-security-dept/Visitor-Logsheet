<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#DF6A2E">
<title>Security Personnel Console — Visitor Log</title>
<style>
  :root{--brand:#DF6A2E;--brand-dk:#B94F1A;--brand-tint:#FDF0E7;
    --ink:#1A1512;--paper:#FCFAF8;--line:#E2D9D1;--muted:#726860;--ok:#1F6B45;--bad:#8C1220}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px}
  header{background:var(--brand);color:#fff;padding:16px;
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .date{font-size:14px;opacity:.9}
  /* Near full width: the Pending tab carries 12 columns and the officer needs
     to read them all without scrolling sideways. The PIN gate re-centres
     itself below via its own max-width. */
  .wrap{max-width:none;margin:0;padding:18px 16px 60px}

  .gate{max-width:340px;margin:60px auto;text-align:center}
  .gate h2{font-size:19px;font-weight:600;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
  .gate input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.3em;
    border:1.5px solid var(--line);border-radius:7px;background:#fff;font-family:inherit}
  .gate input.name{font-size:16px;letter-spacing:0;text-align:left;padding:13px 14px;margin-top:10px}
  .gate input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(223,106,46,.18)}
  .gate button{width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:600;
    font-family:inherit;border:none;border-radius:7px;background:var(--brand);color:#fff;cursor:pointer}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{padding:9px 16px;border:1.5px solid var(--line);background:#fff;
    border-radius:7px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tabs button.warnTab{border-color:#E3CFA0;color:#8A5A00;background:#FDF4E3}
  .tabs button.warnTab.on{background:#8A5A00;color:#fff;border-color:#8A5A00}
  #search{flex:1;min-width:180px;max-width:460px;padding:9px 12px;font-size:14.5px;
    font-family:inherit;border:1.5px solid var(--line);border-radius:7px;background:#fff}
  #search:focus{outline:none;border-color:var(--brand)}
  .count{color:var(--muted);font-size:14px;white-space:nowrap}
  .err{background:#FBEAEC;border:1px solid #E4B4BB;color:var(--bad);
    padding:12px 14px;border-radius:7px;font-size:14.5px;margin-bottom:16px}
  .notice{background:#FDF4E3;border:1px solid #E3CFA0;color:#8A5A00;
    padding:12px 14px;border-radius:7px;font-size:14.5px;margin-bottom:16px}

  .tablebox{background:#fff;border:1.5px solid var(--line);border-radius:8px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--brand-tint);text-align:left;padding:10px;font-weight:600;
    white-space:nowrap;border-bottom:1.5px solid var(--line);cursor:pointer;user-select:none}
  th.nosort{cursor:default}
  th .car{color:var(--muted);font-size:11px;margin-left:3px}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.out td{color:var(--muted)}
  .badge{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ref{font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums;white-space:nowrap;
    color:var(--brand-dk)}
  .nm{font-weight:600}
  .addr{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Long free text may wrap rather than push the table wider. */
  td:not(.badge):not(.ref):not(.time):not(.acts){overflow-wrap:anywhere}
  .time{font-variant-numeric:tabular-nums;white-space:nowrap}
  .raw{font-family:Menlo,Consolas,monospace;font-size:13px;background:#FDF4E3;padding:2px 6px;border-radius:4px}
  .acts{white-space:nowrap}
  .acts button{padding:6px 11px;border:1.5px solid var(--line);background:#fff;
    border-radius:6px;font-size:13.5px;font-family:inherit;cursor:pointer;margin-right:6px}
  .acts button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
  .acts button.dny{color:var(--bad);border-color:#E4B4BB}
  .acts button:disabled{opacity:.5;cursor:default}
  .acts input{padding:6px 9px;font-size:14px;font-family:inherit;border:1.5px solid var(--line);
    border-radius:6px;margin-right:6px;background:#fff}
  .acts input.bd{width:90px;font-size:16px;letter-spacing:.15em;text-align:center;font-weight:600}
  .acts input.rs{width:220px}
  .acts input:focus{outline:none;border-color:var(--brand)}
  .acts .ferr{display:block;color:var(--bad);font-size:12.5px;margin-top:4px;white-space:normal}
  .chk{color:var(--ok);font-weight:600;white-space:nowrap}
  .dash{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:44px 0}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <h1>Security Personnel Console &mdash; Visitors Logsheet</h1>
  <span class="date" id="today"></span>
</header>

<div class="wrap">
  <div id="gate" class="gate">
    <h2>Security personnel access</h2>
    <p>Enter the console PIN.</p>
    <div id="gateErr" class="err hide"></div>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <input id="personnelName" class="name" type="text" placeholder="Your name" maxlength="24">
    <button id="btnGate">Open console</button>
  </div>

  <div id="console" class="hide">
    <div id="err" class="err hide"></div>
    <div id="unkNote" class="notice hide"></div>
    <div class="bar">
      <div class="tabs" id="tabs">
        <button data-tab="pending" class="on">Pending</button>
        <button data-tab="inside">Inside</button>
        <button data-tab="done">Signed out</button>
        <button data-tab="denied">Denied</button>
        <button data-tab="unknown" class="warnTab hide">Unrecognised</button>
      </div>
      <input id="search" type="search" placeholder="Search…">
      <span class="count" id="count"></span>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ══ PASTE YOUR APPS SCRIPT /exec URL HERE ══════════════════════════════════
var API_URL = 'https://script.google.com/macros/s/AKfycbyJ3Gch9Mn-sCgt8kfNB0aItP_AGnnLjvNYxs_JgIonSxP63UAcQmqTU_9JibkGCN7z/exec';

var PIN='', PERSONNEL='', tab='pending', timer=null;
var data={pending:[],inside:[],done:[],denied:[],unknown:[]};
var $=function(i){return document.getElementById(i)};

/* One open inline action at a time: {row, kind:'approve'|'deny', value, err} */
var open=null;

var TABS={
  pending:{
    label:'Pending', count:'pending', sortKey:'submittedAt', sortDir:1,   // oldest first: it is a queue
    search:['refCode','name','dept','idNo','company','address','visitorType'],
    placeholder:'Search ref code, name, type, department, ID number, company…',
    cols:[
      {k:'refCode',     t:'Ref'},
      {k:'submittedAt', t:'Submitted', time:true},
      {k:'name',        t:'Name'},
      {k:'visitorType', t:'Type'},
      {k:'company',     t:'Company'},
      {k:'contactNo',   t:'Contact no.'},
      {k:'address',     t:'Address'},
      {k:'idPresented', t:'ID'},
      {k:'idNo',        t:'ID no.'},
      {k:'dept',        t:'Dept'},
      {k:'contact',     t:'Contact person'},
      {k:'purpose',     t:'Purpose'}
    ],
    actions:true
  },
  inside:{
    label:'Inside', count:'inside', sortKey:'timeIn', sortDir:-1,
    search:['badgeNo','refCode','name','dept','contact','purpose','company','visitorType'],
    placeholder:'Search badge, name, type, department, company…',
    cols:[
      {k:'badgeNo',   t:'Badge'},
      {k:'name',      t:'Name'},
      {k:'visitorType',t:'Type'},
      {k:'company',   t:'Company'},
      {k:'contactNo', t:'Contact no.'},
      {k:'dept',      t:'Dept'},
      {k:'contact',   t:'Contact person'},
      {k:'purpose',   t:'Purpose'},
      {k:'timeIn',    t:'Time in', time:true},
      {k:'approvedBy',t:'Approved by'}
    ],
    actions:true
  },
  done:{
    label:'Signed out', count:'signed out', sortKey:'timeOut', sortDir:-1,
    search:['badgeNo','refCode','name','dept','contact','purpose','company','visitorType'],
    placeholder:'Search badge, name, type, department, company…',
    cols:[
      {k:'badgeNo',   t:'Badge'},
      {k:'name',      t:'Name'},
      {k:'visitorType',t:'Type'},
      {k:'company',   t:'Company'},
      {k:'dept',      t:'Dept'},
      {k:'purpose',   t:'Purpose'},
      {k:'timeIn',    t:'Time in', time:true},
      {k:'timeOut',   t:'Time out', time:true},
      {k:'approvedBy',t:'Approved by'}
    ]
  },
  denied:{
    label:'Denied', count:'denied', sortKey:'submittedAt', sortDir:-1,
    search:['refCode','name','dept','idNo','deniedReason','company','visitorType'],
    placeholder:'Search ref code, name, type, department, company, reason…',
    cols:[
      {k:'refCode',     t:'Ref'},
      {k:'submittedAt', t:'Submitted', time:true},
      {k:'name',        t:'Name'},
      {k:'visitorType', t:'Type'},
      {k:'company',     t:'Company'},
      {k:'contactNo',   t:'Contact no.'},
      {k:'dept',        t:'Dept'},
      {k:'purpose',     t:'Purpose'},
      {k:'deniedReason',t:'Reason'},
      {k:'approvedBy',  t:'Denied by'}
    ]
  },
  unknown:{
    label:'Unrecognised', count:'unrecognised', sortKey:'row', sortDir:-1,
    search:['rawStatus','refCode','badgeNo','name','dept'],
    placeholder:'Search status, ref code, badge, name…',
    cols:[
      {k:'row',         t:'Sheet row'},
      {k:'rawStatus',   t:'STATUS cell'},
      {k:'refCode',     t:'Ref'},
      {k:'badgeNo',     t:'Badge'},
      {k:'name',        t:'Name'},
      {k:'dept',        t:'Dept'},
      {k:'submittedAt', t:'Submitted', time:true},
      {k:'timeIn',      t:'Time in', time:true},
      {k:'timeOut',     t:'Time out', time:true}
    ]
  }
};
var sortKey=TABS.pending.sortKey, sortDir=TABS.pending.sortDir;

/** Plain-string body: a simple request, no preflight. Never add a Content-Type header. */
function api(p){
  p.pin=PIN; p.personnelName=PERSONNEL;
  return fetch(API_URL,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json()});
}

$('btnGate').addEventListener('click',openConsole);
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')openConsole()});
$('personnelName').addEventListener('keydown',function(e){if(e.key==='Enter')openConsole()});

function openConsole(){
  PIN=$('pin').value.trim();
  PERSONNEL=$('personnelName').value.trim()||'SECURITY';
  if(!PIN){ gateErr('Enter the PIN.'); return; }
  api({action:'today'}).then(function(res){
    if(!res.ok){ gateErr(res.message||'Access denied.'); return; }
    sessionStorage.setItem('vg_pin',PIN);
    sessionStorage.setItem('vg_name',PERSONNEL);
    $('gate').classList.add('hide');
    $('console').classList.remove('hide');
    switchTab('pending');
    apply(res);
    if(!timer) timer=setInterval(load,20000);
  }).catch(function(){ gateErr('Cannot reach the server.') });
}
function gateErr(m){ var e=$('gateErr'); e.textContent=m; e.classList.remove('hide'); }
function showErr(m){ var e=$('err'); e.textContent=m||''; e.classList.toggle('hide',!m); }

function load(){
  api({action:'today'}).then(function(r){ if(r.ok) apply(r); else showErr(r.message); })
    .catch(function(){});
}
function apply(res){
  data={pending:res.pending||[],inside:res.inside||[],done:res.done||[],
        denied:res.denied||[],unknown:res.unknown||[]};
  $('today').textContent=res.today||'';
  showErr('');
  // If the row someone was acting on has left the pending list, drop the inline form.
  if(open && !data.pending.some(function(v){return v.row===open.row})) open=null;
  renderTabs();
  render();
}

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(function(b){
    var k=b.dataset.tab, n=data[k].length;
    if(k==='pending') b.textContent='Pending ('+n+')';
    else if(k==='unknown'){ b.textContent='Unrecognised ('+n+')'; b.classList.toggle('hide',n===0); }
    else b.textContent=TABS[k].label;
    b.classList.toggle('on',k===tab);
  });
  var u=$('unkNote');
  if(data.unknown.length){
    u.textContent=data.unknown.length+' row(s) today have a STATUS the console does not recognise. '+
      'They are listed under Unrecognised. Fix the STATUS cell in the sheet to one of '+
      'PENDING, APPROVED, DENIED or CLOSED.';
    u.classList.remove('hide');
  }else u.classList.add('hide');
  if(tab==='unknown' && !data.unknown.length) switchTab('pending');
}

function switchTab(k){
  tab=k; open=null;
  sortKey=TABS[k].sortKey; sortDir=TABS[k].sortDir;
  $('search').placeholder=TABS[k].placeholder;
  buildHead();
  renderTabs();
  render();
}

function buildHead(){
  var t=TABS[tab];
  $('head').innerHTML = t.cols.map(function(c){
    return '<th data-sort="'+c.k+'">'+c.t+'<span class="car" data-car="'+c.k+'"></span></th>';
  }).join('') + (t.actions ? '<th class="nosort">Actions</th>' : '');
}

$('head').addEventListener('click',function(e){
  var th=e.target.closest('th[data-sort]'); if(!th) return;
  var k=th.dataset.sort;
  if(sortKey===k){ sortDir=-sortDir; } else { sortKey=k; sortDir=1; }
  render();
});

function isTimeCol(k){
  return TABS[tab].cols.some(function(c){ return c.k===k && c.time; });
}

function rows(){
  var t=TABS[tab];
  var list=(data[tab]||[]).slice();
  var q=$('search').value.trim().toLowerCase();
  if(q){
    list=list.filter(function(v){
      return t.search.map(function(k){return v[k]}).join(' ').toLowerCase().indexOf(q)!==-1;
    });
  }
  var timeCol=isTimeCol(sortKey);
  list.sort(function(a,b){
    var x=a[sortKey], y=b[sortKey];
    if(timeCol){ return (mins(x)-mins(y))*sortDir; }
    if(sortKey==='row'){ return (Number(x)-Number(y))*sortDir; }
    return String(x==null?'':x).localeCompare(String(y==null?'':y))*sortDir;
  });
  return list;
}

/** "1:05 PM" -> minutes since midnight, so time columns sort correctly. */
function mins(s){
  var m=String(s==null?'':s).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return -1;
  var h=parseInt(m[1],10)%12, mm=parseInt(m[2],10);
  if(m[3] && m[3].toUpperCase()==='PM') h+=12;
  return h*60+mm;
}

function render(){
  var t=TABS[tab], list=rows();
  $('count').textContent = list.length+' '+t.count;

  document.querySelectorAll('[data-car]').forEach(function(s){
    s.textContent = (s.dataset.car===sortKey) ? (sortDir>0?'▲':'▼') : '';
  });

  var span=t.cols.length+(t.actions?1:0);
  if(!list.length){
    $('body').innerHTML='<tr><td colspan="'+span+'"><div class="empty">Nothing to show.</div></td></tr>';
    return;
  }

  $('body').innerHTML = list.map(function(v){
    var cells=t.cols.map(function(c){ return cell(c,v); }).join('');
    var acts = t.actions ? '<td class="acts">'+actions(v)+'</td>' : '';
    return '<tr class="'+(tab==='done'?'out':'')+'" data-row="'+v.row+'">'+cells+acts+'</tr>';
  }).join('');

  if(open){
    var inp=document.querySelector('tr[data-row="'+open.row+'"] input');
    if(inp){ inp.focus(); var L=inp.value.length; try{inp.setSelectionRange(L,L)}catch(e){} }
  }
}

function cell(c,v){
  var val=v[c.k];
  switch(c.k){
    case 'refCode':   return '<td class="ref">'+esc(val)+'</td>';
    case 'badgeNo':   return '<td class="badge">'+(val?esc(val):'<span class="dash">—</span>')+'</td>';
    case 'name':      return '<td class="nm">'+esc(val)+'</td>';
    case 'company':   return '<td>'+(val?esc(val):'<span class="dash">—</span>')+'</td>';
    case 'address':   return '<td class="addr" title="'+esc(val)+'">'+esc(val)+'</td>';
    case 'contactNo': return '<td class="time">'+(val?'<a href="tel:'+esc(val)+'">'+esc(val)+'</a>':'<span class="dash">—</span>')+'</td>';
    case 'rawStatus': return '<td><span class="raw">'+(val===''?'(blank)':esc(val))+'</span></td>';
    case 'approvedBy':return '<td>'+(val?'<span class="chk">✓ '+esc(val)+'</span>':'<span class="dash">—</span>')+'</td>';
  }
  if(c.time) return '<td class="time">'+(val?esc(val):'<span class="dash">—</span>')+'</td>';
  return '<td>'+esc(val)+'</td>';
}

function actions(v){
  if(tab==='inside'){
    return '<button data-force="'+v.row+'">Close out</button>';
  }
  if(tab!=='pending') return '';
  if(open && open.row===v.row){
    var err = open.err ? '<span class="ferr">'+esc(open.err)+'</span>' : '';
    if(open.kind==='approve'){
      return '<input class="bd" data-in="badge" inputmode="numeric" maxlength="6" placeholder="0000" '+
             'value="'+esc(open.value)+'" aria-label="Badge number to issue">'+
             '<button class="pri" data-confirm="approve"'+(open.busy?' disabled':'')+'>Issue badge</button>'+
             '<button data-cancel="1">Cancel</button>'+err;
    }
    var can = String(open.value||'').trim().length>0 && !open.busy;
    return '<input class="rs" data-in="reason" maxlength="200" placeholder="Reason (required)" '+
           'value="'+esc(open.value)+'" aria-label="Reason for denying">'+
           '<button class="dny" data-confirm="deny"'+(can?'':' disabled')+'>Deny</button>'+
           '<button data-cancel="1">Cancel</button>'+err;
  }
  return '<button class="pri" data-approve="'+v.row+'">Approve</button>'+
         '<button class="dny" data-deny="'+v.row+'">Deny</button>';
}

function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}

// ── Actions ─────────────────────────────────────────────────────────────────
$('body').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;

  if(b.dataset.approve){ open={row:Number(b.dataset.approve),kind:'approve',value:'',err:''}; render(); return; }
  if(b.dataset.deny){    open={row:Number(b.dataset.deny),   kind:'deny',   value:'',err:''}; render(); return; }
  if(b.dataset.cancel){  open=null; render(); return; }

  if(b.dataset.confirm==='approve'){ submitApprove(); return; }
  if(b.dataset.confirm==='deny'){    submitDeny();    return; }

  if(b.dataset.force){
    var note=prompt('Reason for manual time out:','Left without scanning');
    if(note===null) return;
    b.disabled=true;
    api({action:'force', row:Number(b.dataset.force), note:note}).then(function(r){
      if(!r.ok) alert(r.message);
      load();
    }).catch(function(){ alert('Cannot reach the server.'); load(); });
  }
});

/* Track typing in the inline inputs without re-rendering on every keystroke,
   except for Deny, where the button must enable once the reason is non-empty. */
$('body').addEventListener('input',function(e){
  var inp=e.target.closest('input[data-in]'); if(!inp||!open) return;
  var was=String(open.value||'').trim().length>0;
  open.value=inp.value;
  var now=String(open.value||'').trim().length>0;
  if(open.kind==='deny' && was!==now){
    var btn=document.querySelector('tr[data-row="'+open.row+'"] button[data-confirm="deny"]');
    if(btn) btn.disabled=!now||!!open.busy;
  }
});
$('body').addEventListener('keydown',function(e){
  var inp=e.target.closest('input[data-in]'); if(!inp||!open) return;
  if(e.key==='Enter'){ e.preventDefault(); open.kind==='approve'?submitApprove():submitDeny(); }
  if(e.key==='Escape'){ open=null; render(); }
});

function submitApprove(){
  if(!open||open.kind!=='approve'||open.busy) return;
  var b=normBadge(open.value);
  if(!b){ open.err='Enter the badge number.'; render(); return; }
  open.value=b; open.err=''; open.busy=true; render();
  api({action:'approve', row:open.row, badgeNo:b}).then(function(r){
    if(!r.ok){ if(open){ open.busy=false; open.err=r.message||'Could not approve.'; } render(); load(); return; }
    open=null; load();
  }).catch(function(){ if(open){ open.busy=false; open.err='Cannot reach the server.'; } render(); });
}

function submitDeny(){
  if(!open||open.kind!=='deny'||open.busy) return;
  var reason=String(open.value||'').trim();
  if(!reason){ open.err='A reason is required.'; render(); return; }
  open.err=''; open.busy=true; render();
  api({action:'deny', row:open.row, reason:reason}).then(function(r){
    if(!r.ok){ if(open){ open.busy=false; open.err=r.message||'Could not deny.'; } render(); load(); return; }
    open=null; load();
  }).catch(function(){ if(open){ open.busy=false; open.err='Cannot reach the server.'; } render(); });
}

/** Same rule as the server: digits only, padded to 4. */
function normBadge(v){
  var d=String(v||'').replace(/\D/g,'');
  if(!d) return '';
  d=d.slice(-4);
  while(d.length<4) d='0'+d;
  return d;
}

$('search').addEventListener('input',render);
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]'); if(!b) return;
  switchTab(b.dataset.tab);
});

(function(){
  var p=sessionStorage.getItem('vg_pin');
  if(p){ $('pin').value=p; $('personnelName').value=sessionStorage.getItem('vg_name')||''; openConsole(); }
})();
</script>
</body>
</html>
