<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#DF6A2E">
<title>Guard console — Visitor Log</title>
<style>
  :root{--brand:#DF6A2E;--brand-dk:#B94F1A;--brand-tint:#FDF0E7;
    --ink:#1A1512;--paper:#FCFAF8;--line:#E2D9D1;--muted:#726860;--ok:#1F6B45}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px}
  header{background:var(--brand);color:#fff;padding:18px 22px;
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:19px;font-weight:600}
  header .date{font-size:14px;opacity:.9}
  .wrap{max-width:900px;margin:0 auto;padding:24px 22px 60px}

  .gate{max-width:340px;margin:60px auto;text-align:center}
  .gate h2{font-size:19px;font-weight:600;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
  input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.3em;
    border:1.5px solid var(--line);border-radius:7px;background:#fff;font-family:inherit}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(223,106,46,.18)}
  .gate button{width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:600;
    font-family:inherit;border:none;border-radius:7px;background:var(--brand);color:#fff;cursor:pointer}

  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabs button{flex:1;padding:12px;border:1.5px solid var(--line);background:#fff;
    border-radius:7px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .row{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--brand);
    padding:14px 16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .row.out{border-left-color:var(--ok);opacity:.72}
  .row .info{flex:1;min-width:200px}
  .row .pass{font-size:13px;color:var(--muted);letter-spacing:.08em}
  .row .nm{font-size:17px;font-weight:600;margin:2px 0}
  .row .meta{font-size:14px;color:var(--muted)}
  .row .times{font-variant-numeric:tabular-nums;font-size:15px;text-align:right;white-space:nowrap}
  .row .acts{display:flex;gap:8px}
  .row button{padding:8px 13px;border:1.5px solid var(--line);background:#fff;
    border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer}
  .row button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chk{color:var(--ok);font-size:14px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .count{font-size:14px;color:var(--muted);margin:0 0 14px}
  .err{background:#FBEAEC;border:1px solid #E4B4BB;color:#8C1220;
    padding:12px 14px;border-radius:7px;font-size:14.5px;margin-bottom:16px}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <h1>Guard console &mdash; Visitors Logsheet</h1>
  <span class="date" id="today"></span>
</header>

<div class="wrap">
  <div id="gate" class="gate">
    <h2>Guard access</h2>
    <p>Enter the console PIN.</p>
    <div id="gateErr" class="err hide"></div>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <input id="guardName" type="text" placeholder="Your name" maxlength="24"
           style="margin-top:10px;font-size:16px;letter-spacing:0;text-align:left;padding:13px 14px">
    <button id="btnGate">Open console</button>
  </div>

  <div id="console" class="hide">
    <div class="tabs">
      <button id="tIn" class="on">Inside</button>
      <button id="tOut">Signed out</button>
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </div>
</div>

<script>
// ══ PASTE YOUR APPS SCRIPT /exec URL HERE ══════════════════════════════════
var API_URL = 'https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID/exec';

var PIN='', GUARD='', tab='inside', data={inside:[],done:[]}, timer=null;
var $=function(i){return document.getElementById(i)};

function api(payload){
  payload.pin = PIN; payload.guardName = GUARD;
  return fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(function(r){return r.json()});
}

$('btnGate').addEventListener('click',openConsole);
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')openConsole()});

function openConsole(){
  PIN=$('pin').value.trim();
  GUARD=$('guardName').value.trim()||'GUARD';
  if(!PIN){ gateErr('Enter the PIN.'); return; }
  api({action:'today'}).then(function(res){
    if(!res.ok){ gateErr(res.message||'Access denied.'); return; }
    sessionStorage.setItem('vg_pin',PIN);
    sessionStorage.setItem('vg_name',GUARD);
    $('gate').classList.add('hide');
    $('console').classList.remove('hide');
    apply(res);
    timer=setInterval(load,20000);
  }).catch(function(){ gateErr('Cannot reach the server.') });
}
function gateErr(m){ var e=$('gateErr'); e.textContent=m; e.classList.remove('hide'); }

function load(){ api({action:'today'}).then(function(res){ if(res.ok) apply(res) }).catch(function(){}); }
function apply(res){ data=res; $('today').textContent=res.today||''; render(); }

function render(){
  var items = data[tab==='inside'?'inside':'done'] || [];
  $('count').textContent = items.length + (tab==='inside' ? ' currently inside' : ' signed out today');
  if(!items.length){ $('list').innerHTML='<div class="empty">Nothing here yet.</div>'; return; }

  $('list').innerHTML = items.map(function(v){
    var acts = tab==='inside'
      ? '<div class="acts">'+
        (v.verifiedBy ? '<span class="chk">&#10003; '+esc(v.verifiedBy)+'</span>'
                      : '<button class="pri" data-verify="'+v.row+'">Verify</button>')+
        '<button data-force="'+v.row+'">Close out</button></div>'
      : (v.verifiedBy ? '<span class="chk">&#10003; '+esc(v.verifiedBy)+'</span>' : '');
    return '<div class="row'+(tab==='inside'?'':' out')+'">'+
      '<div class="info"><div class="pass">PASS '+esc(v.passNo)+'</div>'+
      '<div class="nm">'+esc(v.name)+'</div>'+
      '<div class="meta">'+esc([v.dept,v.contact].filter(Boolean).join(' \u00B7 '))+'</div></div>'+
      '<div class="times">In '+esc(v.timeIn)+(v.timeOut?'<br>Out '+esc(v.timeOut):'')+'</div>'+
      acts+'</div>';
  }).join('');
}

function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.verify){
    api({action:'verify', row:Number(b.dataset.verify)}).then(load);
  }else if(b.dataset.force){
    var note=prompt('Reason for manual time out:','Left without scanning');
    if(note===null) return;
    api({action:'force', row:Number(b.dataset.force), note:note}).then(function(r){
      if(!r.ok) alert(r.message); load();
    });
  }
});

$('tIn').addEventListener('click',function(){tab='inside';$('tIn').className='on';$('tOut').className='';render()});
$('tOut').addEventListener('click',function(){tab='done';$('tOut').className='on';$('tIn').className='';render()});

// Restore the session so a refresh at the post doesn't ask for the PIN again.
(function(){
  var p=sessionStorage.getItem('vg_pin');
  if(p){ $('pin').value=p; $('guardName').value=sessionStorage.getItem('vg_name')||''; openConsole(); }
})();
</script>
</body>
</html>
